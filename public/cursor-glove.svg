    <!-- Middle finger -->
    <path d="M16 13V6C16 4.6 17 3.5 18.2 3.5C19.4 3.5 20.4 4.6 20.4 6V13" fill="white"/>
    <path d="M16 13V6C16 4.6 17 3.5 18.2 3.5C19.4 3.5 20.4 4.6 20.4 6V13" stroke="#1a1a1a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="white"/>
    <!-- Ring finger -->
    <path d="M20.4 13V7C20.4 5.6 21.3 4.5 22.4 4.5C23.5 4.5 24.4 5.6 24.4 7V13" fill="white"/>
    <path d="M20.4 13V7C20.4 5.6 21.3 4.5 22.4 4.5C23.5 4.5 24.4 5.6 24.4 7V13" stroke="#1a1a1a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="white"/>
    <!-- Thumb -->
    <path d="M11 14.5C11 14.5 8.5 13 7 12C5.8 11.2 4.5 11.8 4 13C3.5 14.2 4.2 15.3 5.2 16L8.5 18.5" fill="white"/>
    <path d="M11 14.5C11 14.5 8.5 13 7 12C5.8 11.2 4.5 11.8 4 13C3.5 14.2 4.2 15.3 5.2 16L8.5 18.5" stroke="#1a1a1a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="white"/>
    <!-- Palm and cuff -->
    <path d="M8.5 18.5C8.5 18.5 7.5 20 7.5 21.5V23H24.4V13H8.5" fill="white"/>
    <path d="M8.5 18.5C8.5 18.5 7.5 20 7.5 21.5V23H24.4V13" stroke="#1a1a1a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="white"/>
    <!-- Cuff -->
    <rect x="7.5" y="23" width="17" height="7.5" rx="1" fill="white" stroke="#1a1a1a" stroke-width="1.6"/>
    <!-- Cuff detail lines -->
    <line x1="12" y1="24" x2="12" y2="29.5" stroke="#1a1a1a" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="16" y1="24" x2="16" y2="29.5" stroke="#1a1a1a" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="20" y1="24" x2="20" y2="29.5" stroke="#1a1a1a" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
